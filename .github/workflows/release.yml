name: Release

# Builds k6 (pinned) + this extension with xk6 for all supported platforms and
# publishes a GitHub release tagged v<k6-version>-<n> with SHA256SUMS.
# Run: gh workflow run release.yml -f revision=<n>
on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Build number n for tag v<k6-version>-<n>"
        required: true
        default: "1"

env:
  K6_VERSION: v2.4.0
  XK6_VERSION: v1.5.1
  GO_VERSION: "1.26.x"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Preprocessor tests + bundle is up to date
        working-directory: preprocessor
        run: |
          npm ci --ignore-scripts
          npm test
          npm run bundle
          git diff --exit-code -- ../instrument/bundle.js
      - name: Go tests
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install xk6
        run: go install go.k6.io/xk6/cmd/xk6@${{ env.XK6_VERSION }}
      - name: Build k6 ${{ env.K6_VERSION }} + k6-debug (xk6 reads K6_VERSION)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          xk6 build \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }} \
            --with github.com/${{ github.repository }}=. \
            --output dist/k6-debug-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
      - name: DAP smoke test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: python3 test/dap_smoke_test.py dist/k6-debug-linux-amd64
      - uses: actions/upload-artifact@v5
        with:
          name: k6-debug-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: k6-debug-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x k6-debug-*
          sha256sum k6-debug-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.K6_VERSION }}-${{ inputs.revision }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "k6-debug $TAG (k6 ${K6_VERSION})" \
            --notes "k6 ${K6_VERSION} built with xk6 ${XK6_VERSION} + k6-debug (commit ${GITHUB_SHA}). k6 is AGPL-3.0: source https://github.com/grafana/k6/tree/${K6_VERSION}; extension source: this repository at ${GITHUB_SHA}. Verify downloads with SHA256SUMS."
